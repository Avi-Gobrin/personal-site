<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AviOS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #1c2a4a;
    --border: #2a3a5e;
    --border-light: #3a4a6e;
    --text: #e0e0e8;
    --text-dim: #8890a8;
    --accent: #c8a46e;
    --accent2: #e8c48e;
    --red: #e25555;
    --yellow: #e8c840;
    --green: #50c878;
    --blue: #4a9eff;
    --title-bar: #0f1628;
    --title-active: #1a2844;
    --shadow: rgba(0,0,0,0.4);
    --font: 'IBM Plex Sans', -apple-system, sans-serif;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
  }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: var(--font);
    color: var(--text);
    background: var(--bg);
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Wallpaper */
  #wallpaper {
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 30% 20%, rgba(200,164,110,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(74,158,255,0.06) 0%, transparent 50%),
      linear-gradient(180deg, #0f1628 0%, #1a1a2e 40%, #16213e 100%);
    z-index: 0;
  }
  #wallpaper::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='6' height='6' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='1' height='1' fill='white' opacity='0.02'/%3E%3C/svg%3E");
  }

  /* Menu Bar */
  #menubar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 28px;
    background: rgba(15,22,40,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 9999;
    font-size: 13px;
    font-weight: 500;
  }

  #menubar .left { display: flex; align-items: center; gap: 16px; }
  #menubar .logo {
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.5px;
    cursor: pointer;
    padding: 2px 8px;
    border-radius: 4px;
  }
  #menubar .logo:hover { background: rgba(200,164,110,0.15); }
  #menubar .menu-item {
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 12px;
  }
  #menubar .menu-item:hover { color: var(--text); background: rgba(255,255,255,0.08); }
  #menubar .right {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
  }

  /* Desktop Icons */
  #desktop-icons {
    position: fixed;
    top: 40px; left: 16px;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .desktop-icon {
    width: 72px;
    padding: 8px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .desktop-icon:hover { background: rgba(200,164,110,0.12); }
  .desktop-icon:active { background: rgba(200,164,110,0.2); }
  .desktop-icon .icon {
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    border-radius: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
  }
  .desktop-icon .label {
    font-size: 10px;
    text-align: center;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    line-height: 1.2;
  }

  /* Windows */
  .window {
    position: absolute;
    min-width: 280px;
    min-height: 180px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 8px 32px var(--shadow), 0 2px 8px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }
  .window.active {
    box-shadow: 0 12px 48px var(--shadow), 0 4px 16px rgba(0,0,0,0.4);
    border-color: var(--border-light);
  }
  .window.minimized { display: none; }
  .window.maximized {
    top: 28px !important;
    left: 0 !important;
    width: 100vw !important;
    height: calc(100vh - 28px - 56px) !important;
    border-radius: 0;
  }

  .title-bar {
    height: 32px;
    background: var(--title-bar);
    display: flex;
    align-items: center;
    padding: 0 10px;
    cursor: grab;
    flex-shrink: 0;
    gap: 8px;
  }
  .title-bar:active { cursor: grabbing; }
  .window.active .title-bar { background: var(--title-active); }

  .window-controls {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .window-controls span {
    width: 12px; height: 12px;
    border-radius: 50%;
    cursor: pointer;
    transition: filter 0.15s;
  }
  .window-controls span:hover { filter: brightness(1.3); }
  .window-controls .close { background: var(--red); }
  .window-controls .minimize { background: var(--yellow); }
  .window-controls .maximize { background: var(--green); }

  .title-text {
    flex: 1;
    text-align: center;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .window.active .title-text { color: var(--text); }

  .window-body {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
  }
  .window-body::-webkit-scrollbar { width: 6px; }
  .window-body::-webkit-scrollbar-track { background: transparent; }
  .window-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .window-body h2 {
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 12px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .window-body h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent2);
    margin-top: 16px;
    margin-bottom: 6px;
  }
  .window-body p {
    margin-bottom: 10px;
    color: #c8c8d8;
  }
  .window-body a { color: var(--blue); text-decoration: none; }
  .window-body a:hover { text-decoration: underline; }
  .window-body ul {
    margin: 8px 0 12px 20px;
    color: #c8c8d8;
  }
  .window-body li { margin-bottom: 6px; }
  .window-body .tag {
    display: inline-block;
    background: rgba(200,164,110,0.15);
    color: var(--accent2);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    margin: 2px 2px;
    font-family: var(--mono);
  }

  /* Terminal */
  .terminal-body {
    background: #0a0e18;
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px;
    flex: 1;
    overflow-y: auto;
    color: var(--green);
    line-height: 1.5;
  }
  .terminal-body::-webkit-scrollbar { width: 6px; }
  .terminal-body::-webkit-scrollbar-thumb { background: #2a3a2a; border-radius: 3px; }

  .terminal-line { margin-bottom: 2px; white-space: pre-wrap; word-break: break-all; }
  .terminal-line .prompt-text { color: var(--accent); }
  .terminal-line .cmd { color: var(--text); }
  .terminal-line .output { color: #88a888; }
  .terminal-line .error { color: var(--red); }

  .terminal-input-line {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .terminal-input-line .prompt-text { color: var(--accent); white-space: pre; }
  #terminal-input {
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    flex: 1;
    caret-color: var(--green);
  }

  /* Dock */
  #dock {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 12px;
    background: rgba(15,22,40,0.85);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 14px;
    z-index: 9998;
  }

  .dock-item {
    width: 42px; height: 42px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    position: relative;
  }
  .dock-item:hover {
    transform: scale(1.2) translateY(-4px);
    background: rgba(255,255,255,0.1);
  }
  .dock-item.has-window::after {
    content: '';
    position: absolute;
    bottom: -2px;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .dock-item .tooltip {
    display: none;
    position: absolute;
    bottom: 52px;
    background: rgba(15,22,40,0.95);
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    white-space: nowrap;
    color: var(--text);
  }
  .dock-item:hover .tooltip { display: block; }
  .dock-sep {
    width: 1px;
    height: 32px;
    background: var(--border);
    margin: 0 4px;
  }

  /* Project cards in window */
  .project-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-bottom: 12px;
    transition: border-color 0.2s;
  }
  .project-card:hover { border-color: var(--accent); }
  .project-card h4 {
    font-size: 14px;
    color: var(--accent2);
    margin-bottom: 6px;
  }
  .project-card p {
    font-size: 13px;
    margin-bottom: 8px;
    color: #aab0c8;
  }

  /* Writing entries */
  .writing-entry {
    padding: 10px 0;
    border-bottom: 1px solid rgba(42,58,94,0.5);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
  }
  .writing-entry:last-child { border-bottom: none; }
  .writing-entry .title { color: var(--text); font-size: 13px; }
  .writing-entry .date { color: var(--text-dim); font-size: 11px; font-family: var(--mono); white-space: nowrap; }

  /* Responsive */
  @media (max-width: 600px) {
    #desktop-icons { display: none; }
    .window {
      width: calc(100vw - 8px) !important;
      left: 4px !important;
      min-width: unset;
    }
    #dock { 
      bottom: 4px;
      padding: 4px 8px;
      gap: 2px;
    }
    .dock-item { width: 36px; height: 36px; font-size: 17px; }
  }
</style>
</head>

// ========== WINDOW MANAGEMENT ==========
let zIndex = 100;
const windowEls = {};
const windowState = {};

function createWindow(id) {
  const def = windowDefs[id];
  if (!def) return;

  const win = document.createElement('div');
  win.className = 'window active';
  win.id = 'win-' + id;
  win.style.width = def.width + 'px';
  win.style.height = def.height + 'px';
  
  // Center or use default position
  const maxX = window.innerWidth - def.width;
  const maxY = window.innerHeight - def.height - 60;
  win.style.left = Math.max(20, Math.min(def.x + Math.random() * 30, maxX)) + 'px';
  win.style.top = Math.max(32, Math.min(def.y + Math.random() * 20, maxY)) + 'px';
  win.style.zIndex = ++zIndex;

  // Title bar
  const titleBar = document.createElement('div');
  titleBar.className = 'title-bar';
  titleBar.innerHTML = `
    <div class="window-controls">
      <span class="close" data-action="close"></span>
      <span class="minimize" data-action="minimize"></span>
      <span class="maximize" data-action="maximize"></span>
    </div>
    <div class="title-text">${def.title}</div>
    <div style="width:48px;"></div>
  `;

  // Window controls
  titleBar.querySelector('.close').addEventListener('click', (e) => {
    e.stopPropagation();
    closeWindow(id);
  });
  titleBar.querySelector('.minimize').addEventListener('click', (e) => {
    e.stopPropagation();
    minimizeWindow(id);
  });
  titleBar.querySelector('.maximize').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMaximize(id);
  });

  win.appendChild(titleBar);

  // Body
  if (def.isTerminal) {
    const body = document.createElement('div');
    body.className = 'terminal-body';
    body.id = 'terminal-output';
    body.innerHTML = `
      <div class="terminal-line"><span class="output">AviOS Terminal v1.0</span></div>
      <div class="terminal-line"><span class="output">Type 'help' for available commands.</span></div>
      <div class="terminal-line">&nbsp;</div>
    `;
    
    const inputLine = document.createElement('div');
    inputLine.className = 'terminal-input-line';
    inputLine.innerHTML = `<span class="prompt-text">avi@avios:~$ </span>`;
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'terminal-input';
    input.autocomplete = 'off';
    input.spellcheck = false;
    input.addEventListener('keydown', handleTerminalInput);
    inputLine.appendChild(input);
    body.appendChild(inputLine);
    
    body.addEventListener('click', () => input.focus());
    win.appendChild(body);
  } else {
    const body = document.createElement('div');
    body.className = 'window-body';
    body.innerHTML = def.content;
    win.appendChild(body);
  }

  // Dragging
  let dragging = false, dragOx, dragOy;
  titleBar.addEventListener('mousedown', (e) => {
    if (e.target.closest('.window-controls')) return;
    dragging = true;
    dragOx = e.clientX - win.offsetLeft;
    dragOy = e.clientY - win.offsetTop;
    bringToFront(id);
    e.preventDefault();
  });

  // Touch dragging
  titleBar.addEventListener('touchstart', (e) => {
    if (e.target.closest('.window-controls')) return;
    const t = e.touches[0];
    dragging = true;
    dragOx = t.clientX - win.offsetLeft;
    dragOy = t.clientY - win.offsetTop;
    bringToFront(id);
  }, { passive: true });

  const onMove = (clientX, clientY) => {
    if (!dragging) return;
    const nx = Math.max(0, Math.min(window.innerWidth - 100, clientX - dragOx));
    const ny = Math.max(28, Math.min(window.innerHeight - 50, clientY - dragOy));
    win.style.left = nx + 'px';
    win.style.top = ny + 'px';
    if (win.classList.contains('maximized')) {
      win.classList.remove('maximized');
      windowState[id].maximized = false;
    }
  };

  document.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
  document.addEventListener('touchmove', (e) => {
    if (dragging) onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  const stopDrag = () => { dragging = false; };
  document.addEventListener('mouseup', stopDrag);
  document.addEventListener('touchend', stopDrag);

  // Click to focus
  win.addEventListener('mousedown', () => bringToFront(id));

  document.body.appendChild(win);
  windowEls[id] = win;
  windowState[id] = { minimized: false, maximized: false };
  updateDockIndicators();

  // Focus terminal input
  if (def.isTerminal) {
    setTimeout(() => {
      const inp = document.getElementById('terminal-input');
      if (inp) inp.focus();
    }, 100);
  }
}

function openWindow(id) {
  if (windowEls[id]) {
    if (windowState[id].minimized) {
      windowEls[id].classList.remove('minimized');
      windowState[id].minimized = false;
    }
    bringToFront(id);
    if (id === 'terminal') {
      setTimeout(() => {
        const inp = document.getElementById('terminal-input');
        if (inp) inp.focus();
      }, 50);
    }
  } else {
    // Deactivate others
    Object.values(windowEls).forEach(w => w.classList.remove('active'));
    createWindow(id);
  }
}

function closeWindow(id) {
  if (windowEls[id]) {
    windowEls[id].remove();
    delete windowEls[id];
    delete windowState[id];
    updateDockIndicators();
  }
}

function minimizeWindow(id) {
  if (windowEls[id]) {
    windowEls[id].classList.add('minimized');
    windowEls[id].classList.remove('active');
    windowState[id].minimized = true;
  }
}

function toggleMaximize(id) {
  if (windowEls[id]) {
    const isMax = windowEls[id].classList.toggle('maximized');
    windowState[id].maximized = isMax;
  }
}

function bringToFront(id) {
  Object.entries(windowEls).forEach(([k, w]) => {
    w.classList.toggle('active', k === id);
  });
  if (windowEls[id]) {
    windowEls[id].style.zIndex = ++zIndex;
  }
}

function updateDockIndicators() {
  document.querySelectorAll('.dock-item[data-win]').forEach(item => {
    const winId = item.dataset.win;
    item.classList.toggle('has-window', !!windowEls[winId]);
  });
}

function handleTerminalInput(e) {
  if (e.key !== 'Enter') {
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIdx < terminalHistory.length - 1) {
        historyIdx++;
        e.target.value = terminalHistory[terminalHistory.length - 1 - historyIdx] || '';
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIdx > 0) {
        historyIdx--;
        e.target.value = terminalHistory[terminalHistory.length - 1 - historyIdx] || '';
      } else {
        historyIdx = -1;
        e.target.value = '';
      }
    }
    return;
  }

  const cmd = e.target.value.trim();
  e.target.value = '';
  historyIdx = -1;
  if (cmd) terminalHistory.push(cmd);

  const output = document.getElementById('terminal-output');
  
  // Echo command
  const cmdLine = document.createElement('div');
  cmdLine.className = 'terminal-line';
  cmdLine.innerHTML = `<span class="prompt-text">avi@avios:~$ </span><span class="cmd">${escapeHtml(cmd)}</span>`;
  output.insertBefore(cmdLine, output.lastElementChild);

  // Process command
  const parts = cmd.split(/\s+/);
  const command = parts[0].toLowerCase();
  const args = parts.slice(1).join(' ');
  let lines = [];

  if (command === 'clear') {
    while (output.children.length > 1) {
      output.removeChild(output.firstChild);
    }
    return;
  } else if (command === 'echo') {
    lines = [args || ''];
  } else if (command === 'cat') {
    const file = args.replace(/\.md$|\.pdf$|\.txt$/, '');
    if (terminalCommands[file]) {
      lines = terminalCommands[file]();
    } else {
      lines = [`cat: ${args}: No such file or directory`];
    }
  } else if (command === 'open') {
    const winId = args.toLowerCase();
    if (windowDefs[winId]) {
      openWindow(winId);
      lines = [`Opening ${winId}...`];
    } else {
      lines = [`open: ${args}: not found. Try: about, projects, writing, fun, terminal, resume, links`];
    }
  } else if (terminalCommands[command]) {
    lines = terminalCommands[command]();
  } else if (command) {
    lines = [`avish: command not found: ${command}`, `Type 'help' for available commands.`];
  }

  for (const line of lines) {
    const el = document.createElement('div');
    el.className = 'terminal-line';
    el.innerHTML = `<span class="output">${escapeHtml(line)}</span>`;
    output.insertBefore(el, output.lastElementChild);
  }

  // Add blank line
  const blank = document.createElement('div');
  blank.className = 'terminal-line';
  blank.innerHTML = '&nbsp;';
  output.insertBefore(blank, output.lastElementChild);

  // Scroll to bottom
  output.scrollTop = output.scrollHeight;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ========== CLOCK ==========
function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  const day = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  document.getElementById('clock').textContent = `${day}  ${h12}:${m} ${ampm}`;
}
updateClock();
