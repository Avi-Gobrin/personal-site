function spriteFromStr(strs, pal) {
  const rows = strs.map(s => s);
  const h = rows.length, w = rows[0].length;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d');
  for (let y = 0; y < h; y++)
    for (let i = 0; i < w; i++) {
      const ch = rows[y][i];
      if (ch !== '.' && pal[ch]) {
        x.fillStyle = pal[ch];
        x.fillRect(i, y, 1, 1);
      }
    }
  return c;
}

function mirrorSprite(spr) {
  const c = document.createElement('canvas');

  const x = c.getContext('2d');
  x.translate(spr.width, 0);
  x.scale(-1, 1);
  x.drawImage(spr, 0, 0);
  return c;

// ========== CANVAS SIZING ==========
function resize() {
  const maxW = MAP_W * T * SCALE;
  const maxH = MAP_H * T * SCALE;
  const ratio = maxW / maxH;
  let w = Math.min(window.innerWidth, maxW);
  let h = w / ratio;
  if (h > window.innerHeight) {
    h = window.innerHeight;
    w = h * ratio;
  }
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  canvas.width = MAP_W * T;
  canvas.height = MAP_H * T;
}
resize();
window.addEventListener('resize', resize);

function drawTile(type, tx, ty) {
  const key = type + '_' + ((tx + ty * 7 + time) & 3);
  
  switch(type) {
    case GRASS: {
      ctx.fillStyle = '#4a8c3f';
      ctx.fillRect(tx * T, ty * T, T, T);
      // Subtle grass variation
      const seed = (tx * 31 + ty * 17) % 7;
      if (seed < 2) {
        ctx.fillStyle = '#55964a';
        ctx.fillRect(tx * T + 3, ty * T + 5, 2, 1);
        ctx.fillRect(tx * T + 9, ty * T + 11, 2, 1);
      }
      break;
    }
    case DARK_GRASS: {
      ctx.fillStyle = '#3d7535';
      ctx.fillRect(tx * T, ty * T, T, T);
      break;
    }
    case PATH: {
      ctx.fillStyle = '#d4b896';
      ctx.fillRect(tx * T, ty * T, T, T);
      // Subtle dirt texture
      ctx.fillStyle = '#c9ad87';
      const s = (tx * 13 + ty * 23) % 5;
      ctx.fillRect(tx * T + s * 2, ty * T + 3, 2, 1);
      ctx.fillRect(tx * T + 7, ty * T + s * 2 + 1, 1, 2);
      break;
    }
    case WATER: {
      ctx.fillStyle = '#2971b8';
      ctx.fillRect(tx * T, ty * T, T, T);
      // Animated ripples
      ctx.fillStyle = '#3d8fd4';
      const wo = Math.floor(time / 20) % 4;
      ctx.fillRect(tx * T + ((wo + tx * 3) % 12), ty * T + 4, 4, 1);
      ctx.fillRect(tx * T + ((wo + 6 + tx * 5) % 12), ty * T + 10, 3, 1);
      break;
    }
    case TREE: {
      // Ground
      ctx.fillStyle = '#4a8c3f';
      ctx.fillRect(tx * T, ty * T, T, T);
      // Trunk
      ctx.fillStyle = C.brown;
      ctx.fillRect(tx * T + 6, ty * T + 10, 4, 6);
      // Canopy
      const variant = (tx + ty) % 2;
      ctx.fillStyle = variant ? '#2d7a2a' : '#1f6b1e';
      ctx.fillRect(tx * T + 2, ty * T + 1, 12, 10);
      ctx.fillStyle = variant ? '#38923a' : '#2d8230';
      ctx.fillRect(tx * T + 3, ty * T + 2, 10, 7);
      ctx.fillRect(tx * T + 4, ty * T + 0, 8, 2);
      // Highlights
      ctx.fillStyle = '#4aad4e';
      ctx.fillRect(tx * T + 4, ty * T + 3, 3, 2);
      break;
    }
    case FLOWER: {
      ctx.fillStyle = '#4a8c3f';
      ctx.fillRect(tx * T, ty * T, T, T);
      // Flower
      const fColors = [C.red, C.yellow, C.pink, C.orange];
      const fc = fColors[(tx * 3 + ty * 7) % 4];
      const sway = Math.sin(time / 30 + tx * 2 + ty) * 1;
      ctx.fillStyle = C.dkgreen;
      ctx.fillRect(tx * T + 7, ty * T + 8, 1, 5);
      ctx.fillStyle = fc;
      ctx.fillRect(tx * T + 6 + Math.round(sway), ty * T + 5, 3, 3);
      ctx.fillStyle = C.yellow;
      ctx.fillRect(tx * T + 7 + Math.round(sway), ty * T + 6, 1, 1);
      break;
    }
    case FENCE: {
      ctx.fillStyle = '#4a8c3f';
      ctx.fillRect(tx * T, ty * T, T, T);
      ctx.fillStyle = '#c9a86c';
      ctx.fillRect(tx * T + 2, ty * T + 4, 3, 8);
      ctx.fillRect(tx * T + 11, ty * T + 4, 3, 8);
      ctx.fillRect(tx * T, ty * T + 6, T, 2);
      ctx.fillRect(tx * T, ty * T + 10, T, 2);
      break;
    }
    case STONE: {
      ctx.fillStyle = '#4a8c3f';
      ctx.fillRect(tx * T, ty * T, T, T);
      break;
    }
  }
}

// ========== BUILDING RENDERING ==========
function drawBuilding(b) {
  const bx = b.x * T, by = b.y * T;
  const bw = b.w * T, bh = b.h * T;
  
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.fillRect(bx + 4, by + 4, bw, bh);
  
  // Roof (triangle-ish)
  ctx.fillStyle = b.roof;
  ctx.fillRect(bx - 4, by - 8, bw + 8, 14);
  ctx.fillRect(bx, by - 12, bw, 8);
  ctx.fillRect(bx + 8, by - 16, bw - 16, 6);
  
  // Roof highlight
  ctx.fillStyle = b.accent;
  ctx.fillRect(bx + 8, by - 16, bw - 16, 2);
  
  // Walls
  ctx.fillStyle = b.color;
  ctx.fillRect(bx, by, bw, bh);
  
  // Wall highlight
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(bx, by, bw, 4);
  
  // Door
  const dx = b.doorX * T, dy = (b.y + b.h - 1) * T;
  ctx.fillStyle = C.dkblue;
  ctx.fillRect(dx - 2, dy + 2, T + 4, T - 2);
  ctx.fillStyle = '#2a1f14';
  ctx.fillRect(dx, dy + 4, T, T - 4);
  // Doorknob
  ctx.fillStyle = C.yellow;
  ctx.fillRect(dx + T - 4, dy + T - 6, 2, 2);
  
  // Windows
  const winY = by + 8;
  ctx.fillStyle = C.yellow;
  ctx.globalAlpha = 0.7 + Math.sin(time / 40 + b.x) * 0.15;
  ctx.fillRect(bx + 8, winY, 10, 10);
  ctx.fillRect(bx + bw - 18, winY, 10, 10);
  ctx.globalAlpha = 1;
  // Window frames
  ctx.fillStyle = b.roof;
  ctx.fillRect(bx + 12, winY, 2, 10);
  ctx.fillRect(bx + 8, winY + 4, 10, 2);
  ctx.fillRect(bx + bw - 14, winY, 2, 10);
  ctx.fillRect(bx + bw - 18, winY + 4, 10, 2);
  
  // Sign above door
  ctx.fillStyle = C.white;
  ctx.fillRect(dx - 6, by - 4, T + 12, 8);
  ctx.fillStyle = C.dkblue;
  ctx.fillRect(dx - 5, by - 3, T + 10, 6);
  
  // Sign text (simple pixel text)
  drawPixelText(ctx, b.name.toUpperCase(), dx - 2, by - 2, C.white, 1);
}

// Simple pixel font (3x5 uppercase)
const PIXEL_FONT = {
  'A': [0b111,0b101,0b111,0b101,0b101],
  'B': [0b110,0b101,0b110,0b101,0b110],
  'C': [0b111,0b100,0b100,0b100,0b111],
  'D': [0b110,0b101,0b101,0b101,0b110],
  'E': [0b111,0b100,0b110,0b100,0b111],
  'F': [0b111,0b100,0b110,0b100,0b100],
  'G': [0b111,0b100,0b101,0b101,0b111],
  'H': [0b101,0b101,0b111,0b101,0b101],
  'I': [0b111,0b010,0b010,0b010,0b111],
  'J': [0b001,0b001,0b001,0b101,0b111],
  'K': [0b101,0b101,0b110,0b101,0b101],
  'L': [0b100,0b100,0b100,0b100,0b111],
  'M': [0b101,0b111,0b111,0b101,0b101],
  'N': [0b101,0b111,0b111,0b111,0b101],
  'O': [0b111,0b101,0b101,0b101,0b111],
  'P': [0b111,0b101,0b111,0b100,0b100],
  'Q': [0b111,0b101,0b101,0b111,0b001],
  'R': [0b111,0b101,0b110,0b101,0b101],
  'S': [0b111,0b100,0b111,0b001,0b111],
  'T': [0b111,0b010,0b010,0b010,0b010],
  'U': [0b101,0b101,0b101,0b101,0b111],
  'V': [0b101,0b101,0b101,0b101,0b010],
  'W': [0b101,0b101,0b111,0b111,0b101],
  'X': [0b101,0b101,0b010,0b101,0b101],
  'Y': [0b101,0b101,0b010,0b010,0b010],
  'Z': [0b111,0b001,0b010,0b100,0b111],
  '\'': [0b010,0b010,0b000,0b000,0b000],
  ' ': [0b000,0b000,0b000,0b000,0b000],
  '!': [0b010,0b010,0b010,0b000,0b010],
  '.': [0b000,0b000,0b000,0b000,0b010],
};

function drawPixelText(ctx, text, x, y, color, scale) {
  scale = scale || 1;
  ctx.fillStyle = color;
  let cx = x;
  for (const ch of text) {
    const glyph = PIXEL_FONT[ch];
    if (glyph) {
      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 3; col++) {
          if (glyph[row] & (1 << (2 - col))) {
            ctx.fillRect(cx + col * scale, y + row * scale, scale, scale);
          }
        }
      }
    }
    cx += 4 * scale;
  }
}

// ========== PLAYER ==========
function drawPlayer() {
  const sprites = playerSprites[player.dir];
  const frame = sprites[player.frame % sprites.length];
  ctx.drawImage(frame, Math.round(player.x), Math.round(player.y));
}

function updatePlayer(dt) {
  let dx = 0, dy = 0;
  if (keys['ArrowLeft'] || keys['a'] || keys['dpad-left'])  dx -= 1;
  if (keys['ArrowRight'] || keys['d'] || keys['dpad-right']) dx += 1;
  if (keys['ArrowUp'] || keys['w'] || keys['dpad-up'])      dy -= 1;
  if (keys['ArrowDown'] || keys['s'] || keys['dpad-down'])   dy += 1;
  
  player.moving = dx !== 0 || dy !== 0;
  
  if (player.moving) {
    // Normalize diagonal
    if (dx !== 0 && dy !== 0) {
      dx *= 0.707; dy *= 0.707;
    }
    
    // Set direction
    if (Math.abs(dx) > Math.abs(dy)) {
      player.dir = dx < 0 ? 'left' : 'right';
    } else {
      player.dir = dy < 0 ? 'up' : 'down';
    }
    
    // Try move with collision
    const newX = player.x + dx * player.speed;
    const newY = player.y + dy * player.speed;
    
    // Check collision (player hitbox is ~8x6 at bottom center of sprite)
    const hbOx = 4, hbOy = 10, hbW = 8, hbH = 5;
    
    if (!collidesAt(newX + hbOx, player.y + hbOy, hbW, hbH)) {
      player.x = newX;
    }
    if (!collidesAt(player.x + hbOx, newY + hbOy, hbW, hbH)) {
      player.y = newY;
    }
    
    // Clamp to map
    player.x = Math.max(0, Math.min((MAP_W - 1) * T, player.x));
    player.y = Math.max(0, Math.min((MAP_H - 1) * T, player.y));
    
    // Animation
    player.animTimer += dt;
    if (player.animTimer > 150) {
      player.frame = (player.frame + 1) % 4;
      player.animTimer = 0;
    }
  } else {
    player.frame = 0;
    player.animTimer = 0;
  }
}

function collidesAt(x, y, w, h) {
  // Check tile collision
  const t1x = Math.floor(x / T), t1y = Math.floor(y / T);
  const t2x = Math.floor((x + w - 1) / T), t2y = Math.floor((y + h - 1) / T);
  
  for (let ty = t1y; ty <= t2y; ty++) {
    for (let tx = t1x; tx <= t2x; tx++) {
      if (tx < 0 || tx >= MAP_W || ty < 0 || ty >= MAP_H) return true;
      if (SOLID.has(MAP[ty][tx])) return true;
    }
  }
  
  // Check building collision
  for (const b of BUILDINGS) {
    const bx = b.x * T, by = b.y * T;
    const bw = b.w * T, bh = b.h * T;
    if (x + w > bx && x < bx + bw && y + h > by && y < by + bh) {
      return true;
    }
  }
  
  return false;
}

// ========== CAMERA ==========
function updateCamera() {
  const targetX = player.x + 8 - canvas.width / 2;
  const targetY = player.y + 8 - canvas.height / 2;
  camera.x += (targetX - camera.x) * 0.12;
  camera.y += (targetY - camera.y) * 0.12;
  camera.x = Math.max(0, Math.min(MAP_W * T - canvas.width, camera.x));
  camera.y = Math.max(0, Math.min(MAP_H * T - canvas.height, camera.y));
}

// ========== INTERACTION ==========
function checkNearBuilding() {
  const px = player.x + 8, py = player.y + 14;
  nearBuilding = null;
  for (const b of BUILDINGS) {
    const dx = b.doorX * T + 8, dy = b.doorY * T + 8;
    const dist = Math.hypot(px - dx, py - dy);
    if (dist < 28) {
      nearBuilding = b;
      break;
    }
  }
}

function openDialogue(building) {
  gameState = 'dialogue';
  dlgPages = building.pages;
  dlgSpeaker = building.speaker;
  dlgPageIdx = 0;
  dlgCharIdx = 0;
  dlgTimer = 0;
  
  const box = document.getElementById('dialogue-box');
  box.style.display = 'block';
  document.getElementById('dlg-speaker').textContent = building.name;
  document.getElementById('dlg-text').textContent = '';
  document.getElementById('dlg-prompt').textContent = '';
}

function updateDialogue(dt) {
  if (dlgPageIdx >= dlgPages.length) return;
  
  const page = dlgPages[dlgPageIdx];
  dlgTimer += dt;
  
  if (dlgCharIdx < page.length) {
    const charsToAdd = Math.floor(dlgTimer / DLG_SPEED);
    if (charsToAdd > 0) {
      dlgCharIdx = Math.min(dlgCharIdx + charsToAdd, page.length);
      dlgTimer = dlgTimer % DLG_SPEED;
      document.getElementById('dlg-text').textContent = page.substring(0, dlgCharIdx);
      document.getElementById('dlg-prompt').textContent = '';
    }
  } else {
    const isLast = dlgPageIdx >= dlgPages.length - 1;
    document.getElementById('dlg-prompt').textContent = isLast ? '[ENTER to close]' : '[ENTER for more...]';
  }
}

function advanceDialogue() {
  if (dlgPageIdx >= dlgPages.length) return;
  
  const page = dlgPages[dlgPageIdx];
  if (dlgCharIdx < page.length) {
    // Skip to end of current page
    dlgCharIdx = page.length;
    document.getElementById('dlg-text').textContent = page;
    return;
  }
  
  dlgPageIdx++;
  if (dlgPageIdx >= dlgPages.length) {
    closeDialogue();
  } else {
    dlgCharIdx = 0;
    dlgTimer = 0;
    document.getElementById('dlg-text').textContent = '';
    document.getElementById('dlg-prompt').textContent = '';
  }
}

function closeDialogue() {
  gameState = 'playing';
  document.getElementById('dialogue-box').style.display = 'none';
}

// ========== MUSIC (simple chiptune) ==========
function initMusic() {
  if (musicStarted) return;
  musicStarted = true;
  
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    // Town theme melody (simple, pleasant, looping)
    const melody = [
      // [note, duration in beats]
      ['C4', 1], ['E4', 1], ['G4', 1], ['E4', 1],
      ['A4', 1.5], ['G4', 0.5], ['E4', 1], ['C4', 1],
      ['D4', 1], ['F4', 1], ['A4', 1], ['G4', 1],
      ['E4', 1.5], ['D4', 0.5], ['C4', 2],
      ['C4', 1], ['E4', 1], ['G4', 1], ['B4', 1],
      ['C5', 1.5], ['A4', 0.5], ['G4', 1], ['E4', 1],
      ['F4', 1], ['A4', 1], ['G4', 1], ['E4', 1],
      ['D4', 1.5], ['E4', 0.5], ['C4', 2],
    ];
    
    const bass = [
      ['C2', 2], ['C2', 2], ['F2', 2], ['G2', 2],
      ['A2', 2], ['F2', 2], ['G2', 2], ['C2', 2],
      ['C2', 2], ['E2', 2], ['F2', 2], ['G2', 2],
      ['F2', 2], ['G2', 2], ['C2', 2], ['C2', 2],
    ];
    
    const noteFreqs = {
      'C2': 65.41, 'D2': 73.42, 'E2': 82.41, 'F2': 87.31, 'G2': 98.0, 'A2': 110.0,
      'C3': 130.81, 'D3': 146.83, 'E3': 164.81, 'F3': 174.61, 'G3': 196.0, 'A3': 220.0, 'B3': 246.94,
      'C4': 261.63, 'D4': 293.66, 'E4': 329.63, 'F4': 349.23, 'G4': 392.0, 'A4': 440.0, 'B4': 493.88,
      'C5': 523.25, 'D5': 587.33, 'E5': 659.25,
    };
    
    const BPM = 120;
    const beatLen = 60 / BPM;
    
    function playMelodyLoop() {
      if (musicMuted || !audioCtx) return;
      
      let t = audioCtx.currentTime + 0.1;
      
      // Melody (square-ish wave via triangle + slight distortion)
      for (const [note, dur] of melody) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = noteFreqs[note];
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.06, t + 0.02);
        gain.gain.setValueAtTime(0.06, t + dur * beatLen * 0.7);
        gain.gain.linearRampToValueAtTime(0, t + dur * beatLen * 0.95);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur * beatLen);
        t += dur * beatLen;
      }
      
      // Bass
      let tb = audioCtx.currentTime + 0.1;
      for (const [note, dur] of bass) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = noteFreqs[note];
        gain.gain.setValueAtTime(0.08, tb);
        gain.gain.setValueAtTime(0.08, tb + dur * beatLen * 0.8);
        gain.gain.linearRampToValueAtTime(0, tb + dur * beatLen * 0.95);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(tb);
        osc.stop(tb + dur * beatLen);
        tb += dur * beatLen;
      }
      
      // Total loop length
      const totalBeats = melody.reduce((s, m) => s + m[1], 0);
      const loopLen = totalBeats * beatLen;
      
      if (musicInterval) clearTimeout(musicInterval);
      musicInterval = setTimeout(playMelodyLoop, loopLen * 1000 - 100);
    }
    
    playMelodyLoop();
    document.getElementById('music-toggle').style.display = 'block';
  } catch(e) {
    console.log('Audio not available');
  }
}

document.getElementById('music-toggle').addEventListener('click', () => {
  musicMuted = !musicMuted;
  document.getElementById('music-toggle').textContent = musicMuted ? '♪ Off' : '♪ Music';
  if (!musicMuted && musicStarted) {
    initMusic();
  }
  if (musicMuted && musicInterval) {
    clearTimeout(musicInterval);
    musicInterval = null;
  }
});

// ========== TITLE SCREEN ==========
function drawTitle() {
  // Dark sky
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Stars
  for (const star of titleStars) {
    const brightness = 0.4 + Math.sin(time / 20 + star.blink) * 0.4;
    const alpha = Math.max(0, brightness);
    ctx.fillStyle = `rgba(255,241,232,${alpha})`;
    ctx.fillRect(Math.floor(star.x), Math.floor(star.y), star.size, star.size);
  }
  
  // Ground
  ctx.fillStyle = '#1a3a1a';
  ctx.fillRect(0, canvas.height - 80, canvas.width, 80);
  ctx.fillStyle = '#2a5a2a';
  ctx.fillRect(0, canvas.height - 80, canvas.width, 4);
  
  // Small pixel trees on the ground
  for (let i = 0; i < 8; i++) {
    const tx = 30 + i * 60;
    const ty = canvas.height - 70 - (i % 3) * 8;
    ctx.fillStyle = '#1f5f1e';
    ctx.fillRect(tx, ty, 16, 14);
    ctx.fillRect(tx + 2, ty - 4, 12, 6);
    ctx.fillRect(tx + 4, ty - 8, 8, 6);
    ctx.fillStyle = '#4a3020';
    ctx.fillRect(tx + 6, ty + 14, 4, 6);
  }
  
  // Title "AVI'S WORLD" in big pixel text
  const title = "AVI'S WORLD";
  const titleScale = 4;
  const titleW = title.length * 4 * titleScale;
  const titleX = (canvas.width - titleW) / 2;
  const titleY = 60;
  
  // Title shadow
  drawPixelText(ctx, title, titleX + 2, titleY + 2, C.dkblue, titleScale);
  // Title text
  drawPixelText(ctx, title, titleX, titleY, C.yellow, titleScale);
  
  // Subtitle
  const sub = "A PIXEL PORTFOLIO";
  const subScale = 2;
  const subW = sub.length * 4 * subScale;
  drawPixelText(ctx, sub, (canvas.width - subW) / 2, titleY + 36, C.peach, subScale);
  
  // Player sprite in center
  const pSpr = playerSprites.down[0];
  ctx.drawImage(pSpr, canvas.width / 2 - 8, canvas.height - 100);
  
  // "PRESS ENTER" blinking
  const pressText = "PRESS ENTER";
  const pressScale = 2;
  const pressW = pressText.length * 4 * pressScale;
  if (Math.floor(time / 30) % 2 === 0) {
    drawPixelText(ctx, pressText, (canvas.width - pressW) / 2, canvas.height - 40, C.white, pressScale);
  }
}

// ========== MAIN RENDER ==========
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  if (gameState === 'title') {
    drawTitle();
    return;
  }
  
  // Apply camera
  ctx.save();
  ctx.translate(-Math.round(camera.x), -Math.round(camera.y));
  
  // Draw tiles
  // Only draw visible tiles
  const startX = Math.max(0, Math.floor(camera.x / T));
  const startY = Math.max(0, Math.floor(camera.y / T));
  const endX = Math.min(MAP_W, Math.ceil((camera.x + canvas.width) / T) + 1);
  const endY = Math.min(MAP_H, Math.ceil((camera.y + canvas.height) / T) + 1);
  
  for (let y = startY; y < endY; y++) {
    for (let x = startX; x < endX; x++) {
      drawTile(MAP[y][x], x, y);
    }
  }
  
  // Draw buildings (behind player if player is below)
  // Sort by y position for proper layering
  const renderables = [];
  for (const b of BUILDINGS) {
    renderables.push({ type: 'building', y: (b.y + b.h) * T, data: b });
  }
  renderables.push({ type: 'player', y: player.y + 16 });
  renderables.sort((a, b) => a.y - b.y);
  
  for (const r of renderables) {
    if (r.type === 'building') drawBuilding(r.data);
    else drawPlayer();
  }
  
  // Draw interaction markers above buildings when near
  if (nearBuilding && gameState === 'playing') {
    const b = nearBuilding;
    const mx = b.doorX * T + 4;
    const my = (b.y - 2) * T + Math.sin(time / 15) * 3;
    ctx.fillStyle = C.yellow;
    ctx.fillRect(mx, my, 8, 2);
    ctx.fillRect(mx + 2, my + 2, 4, 4);
    ctx.fillRect(mx + 3, my + 7, 2, 2);
  }
  
  ctx.restore();
  
  // HUD
  const hudText = "AVI'S WORLD";
  const hudScale = 1;
  ctx.fillStyle = 'rgba(29,43,83,0.7)';
  ctx.fillRect(0, 0, canvas.width, 12);
  drawPixelText(ctx, hudText, 4, 3, C.white, hudScale);
  
  // Location indicator on right side of HUD
  if (nearBuilding) {
    const locText = nearBuilding.name.toUpperCase();
    const locW = locText.length * 4;
    drawPixelText(ctx, locText, canvas.width - locW - 4, 3, C.yellow, 1);
  }
  
  // Fade overlay
  if (fadeAlpha > 0) {
    ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

// ========== GAME LOOP ==========
let lastTime = 0;

function gameLoop(timestamp) {
  const dt = lastTime ? timestamp - lastTime : 16;
  lastTime = timestamp;
  time++;
  
  if (gameState === 'playing') {
    updatePlayer(dt);
    updateCamera();
    checkNearBuilding();
    
    // Show/hide interaction prompt
    const prompt = document.getElementById('interact-prompt');
    const isMobile = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
    if (nearBuilding) {
      prompt.style.display = 'block';
      prompt.textContent = isMobile ? 'Tap E to interact' : 'Press E to interact';
    } else {
      prompt.style.display = 'none';
    }
    
    // Show links panel
    document.getElementById('links-panel').style.display = 'block';
  } else if (gameState === 'dialogue') {
    updateDialogue(dt);
    document.getElementById('interact-prompt').style.display = 'none';
  }
  
  // Fade handling
  if (fadeDir === -1) {
    fadeAlpha -= 0.03;
    if (fadeAlpha <= 0) { fadeAlpha = 0; fadeDir = 0; }
  } else if (fadeDir === 1) {
    fadeAlpha += 0.03;
    if (fadeAlpha >= 1) { fadeAlpha = 1; fadeDir = 0; }
  }
  
  render();
  requestAnimationFrame(gameLoop);
}

// ========== INPUT ==========
document.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  
  if (gameState === 'title' && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    gameState = 'playing';
    fadeAlpha = 1;
    fadeDir = -1;
    initMusic();
    return;
  }
  
  if (gameState === 'playing' && (e.key === 'e' || e.key === 'E' || e.key === 'Enter')) {
    if (nearBuilding) {
      openDialogue(nearBuilding);
    }
  }
  
  if (gameState === 'dialogue' && (e.key === 'Enter' || e.key === ' ' || e.key === 'e' || e.key === 'E')) {
    e.preventDefault();
    advanceDialogue();
  }
  
  if (e.key === 'Escape' && gameState === 'dialogue') {
    closeDialogue();
  }
  
  // Prevent scrolling
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
    e.preventDefault();
  }
});

document.addEventListener('keyup', (e) => {
  keys[e.key] = false;
});

// Mobile D-pad
document.querySelectorAll('.dpad button').forEach(btn => {
  const dir = btn.dataset.dir;
  
  const start = (e) => {
    e.preventDefault();
    keys['dpad-' + dir] = true;
    if (gameState === 'title') {
      gameState = 'playing';
      fadeAlpha = 1;
      fadeDir = -1;
      initMusic();
    }
  };
  const end = (e) => {
    e.preventDefault();
    keys['dpad-' + dir] = false;
  };
  
  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', end, { passive: false });
  btn.addEventListener('touchcancel', end, { passive: false });
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', end);
  btn.addEventListener('mouseleave', end);
});

// Mobile action button
document.getElementById('action-btn').addEventListener('click', () => {
  if (gameState === 'title') {
    gameState = 'playing';
    fadeAlpha = 1;
    fadeDir = -1;
    initMusic();
  } else if (gameState === 'playing' && nearBuilding) {
    openDialogue(nearBuilding);
  } else if (gameState === 'dialogue') {
    advanceDialogue();
  }
});

// Also allow tap on canvas to start
canvas.addEventListener('click', () => {
  if (gameState === 'title') {
    gameState = 'playing';
    fadeAlpha = 1;
    fadeDir = -1;
    initMusic();
  }
});

// ========== START ==========
requestAnimationFrame(gameLoop);
</script>
</body>
</html>
